[workspace]
members = ["crates/core"]
default-members = [".", "crates/core"]
resolver = "3"

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.100"
license-file = "LICENSE"
repository = "https://github.com/DrStopor/ninjutso-battery-tray"

[package]
name = "ninjutso-battery-tray"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
repository.workspace = true
publish = false

[dependencies]
ninjutso-battery-core = { path = "crates/core" }

[features]
default = ["gpui-ui"]
gpui-ui = ["dep:gpui", "dep:async-channel", "dep:raw-window-handle", "dep:windows", "dep:anyhow"]

[target.'cfg(windows)'.dependencies]
gpui = { version = "=0.2.2", default-features = false, optional = true }
async-channel = { version = "=2.5.0", optional = true }
raw-window-handle = { version = "=0.6.2", optional = true }
anyhow = { version = "=1.0.104", optional = true }
windows = { version = "=0.61.3", optional = true, features = [
    "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm",
    "Win32_System_Threading", "Win32_System_LibraryLoader", "Win32_Security",
    "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_UI_HiDpi",
    "Win32_UI_Controls", "Win32_UI_Accessibility",
    "Win32_Devices_DeviceAndDriverInstallation",
] }
